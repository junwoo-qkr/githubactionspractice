name:  GitHub Actions 사용법 실습

on:
  push:
    branches:
      - main
      - develop

jobs:
  My-Deploy-Job:
    runs-on: ubuntu-latest
    steps:
      - name: Hello World 출력
        run: echo "Hello World"
      
      - name: 1 + 2 출력
        run: echo 1 + 2

      - name: 여러 명령어 작성하기
        run: |
          echo: `1 + 2 = `
          echo: 3